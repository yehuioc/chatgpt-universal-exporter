name: Finalize source upload

on:
  push:
    paths:
      - '.upload_parts/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble userscript
        shell: bash
        run: |
          set -euo pipefail
          cat .upload_parts/part-*.txt > ChatGPT_Universal_Exporter.user.js
          echo "acc8423be45d08d5b4f90c90a56da05a7ab9de6b51ceb88f04998cfaaec894da  ChatGPT_Universal_Exporter.user.js" | sha256sum -c -
          node --check ChatGPT_Universal_Exporter.user.js
      - name: Commit assembled source and clean temporary upload parts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChatGPT_Universal_Exporter.user.js
          git rm -r .upload_parts
          git rm .github/workflows/finalize-upload.yml
          git commit -m "Add ChatGPT Universal Exporter v1.0.9 source"
          git push origin HEAD:main
